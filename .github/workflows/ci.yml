name: Database CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sql-lint:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint Migration Files
        run: sqlfluff lint migrations/ --dialect postgres

  db-migrations:
    name: Flyway Migrations
    runs-on: ubuntu-latest
    needs: sql-lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: flyway_user
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Flyway Migrations
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/flyway/sql \
            flyway/flyway:10 \
            -url=jdbc:postgresql://localhost:5432/mydatabase \
            -user=flyway_user \
            -password=password123 \
            migrate

      - name: Verify Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=password123 psql \
            -h localhost -U flyway_user -d mydatabase \
            -f tests/verify_schema.sql